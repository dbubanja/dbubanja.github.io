name: Studio calculation and Excel checks
on:
  push:
    paths: ['studio/**', '.github/workflows/studio-checks.yml']
  pull_request:
    paths: ['studio/**', '.github/workflows/studio-checks.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: studio
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - run: npm test
      - run: sudo apt-get update -qq && sudo apt-get install -y libreoffice-calc
      - run: python3 -m pip install openpyxl
      - run: node tests/xlsx-build.mjs && python3 tests/xlsx_verify.py
